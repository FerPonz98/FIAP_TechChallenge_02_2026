apiVersion: apps/v1
kind: Deployment

metadata:
  name: fiap-fase2-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fiap-fase2-api

  template:
    metadata:
      labels:
        app: fiap-fase2-api

    spec:
      containers:
        - name: api

          image: fiap-fase2-api:latest

          imagePullPolicy: Never

          command:
            - python
            - -m
            - uvicorn
            - api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"

          ports:
            - containerPort: 8000

          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fiap-fase2-secrets
                  key: OPENAI_API_KEY

            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: fiap-fase2-secrets
                  key: LLM_MODEL

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 20
