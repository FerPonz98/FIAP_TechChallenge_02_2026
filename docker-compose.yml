services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fiap_fase2_api

    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - fiap_network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fiap_fase2_jupyter

    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''

    ports:
      - "8888:8888"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - fiap_network

  postgres:
    image: postgres:16-alpine

    container_name: fiap_fase2_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - fiap_network

  n8n:
    image: n8nio/n8n:latest

    container_name: fiap_fase2_n8n

    ports:
      - "5678:5678"

    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - fiap_network

volumes:
  postgres_data:
  n8n_data:

networks:
  fiap_network:
    driver: bridge
