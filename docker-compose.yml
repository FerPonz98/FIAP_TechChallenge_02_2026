services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fiap_fase2_api

    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    networks:
      - fiap_network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fiap_fase2_jupyter

    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=''

    ports:
      - "8888:8888"

    volumes:
      - .:/app

    env_file:
      - .env

    networks:
      - fiap_network

networks:
  fiap_network:
    driver: bridge
